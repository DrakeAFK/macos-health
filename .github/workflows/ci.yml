name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.25.x
  GOTOOLCHAIN: local
  CGO_ENABLED: "1"
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  quality:
    name: Format, vet, and race tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum

      - name: Check formatting
        run: make fmt-check

      - name: Run go vet
        run: make vet

      - name: Run race-enabled tests
        run: make test-race

      - name: Scan reachable dependencies
        run: make vuln

  build:
    name: Build ${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            goarch: arm64
          - runner: macos-15-intel
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum

      - name: Build native Darwin binary
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o "${RUNNER_TEMP}/macos-health_${GOARCH}" .

      - name: Inspect binary
        run: file "${RUNNER_TEMP}/macos-health_${{ matrix.goarch }}"
